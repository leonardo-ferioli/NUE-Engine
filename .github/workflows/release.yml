name: release

# A tag `v<major>.<minor>.<patch>` builds the SDK for every platform and publishes a GitHub release.
# Run manually (workflow_dispatch) to build the same packages as artifacts without publishing anything.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sdk:
    name: sdk ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, preset: windows-x64 }
          - { os: windows-latest, preset: windows-x86 }
          - { os: ubuntu-latest,  preset: linux-x64 }
          - { os: ubuntu-latest,  preset: android-arm64 }
          - { os: macos-latest,   preset: ios-arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libudev-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja || true
      - name: Android NDK
        if: matrix.preset == 'android-arm64'
        shell: bash
        run: echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DNUE_BUILD_TESTS=OFF -DNUE_BUILD_SAMPLES=OFF
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config Release
      - name: Build iOS libraries (not part of the default Xcode target)
        if: matrix.preset == 'ios-arm64'
        run: cmake --build --preset ios-arm64 --config Release --target nue nue_entry nue_assets -- CODE_SIGNING_ALLOWED=NO
      - name: Install
        shell: bash
        run: |
          name="nue-${{ steps.ver.outputs.version }}-${{ matrix.preset }}"
          cmake --install "build/${{ matrix.preset }}" --config Release --prefix "stage/$name"
          cd stage
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -E tar cf "../$name.zip" --format=zip "$name"
            echo "PACKAGE=$name.zip" >> "$GITHUB_ENV"
          else
            cmake -E tar czf "../$name.tar.gz" "$name"
            echo "PACKAGE=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.preset }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

  docs:
    name: api documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          mkdir -p build/docs
          PROJECT_NUMBER="${{ steps.ver.outputs.version }}" doxygen docs/Doxyfile
          cmake -E tar cf "nue-docs-${{ steps.ver.outputs.version }}.zip" --format=zip build/docs/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: nue-docs-*.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: [sdk, docs]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "NUE Engine $GITHUB_REF_NAME" --generate-notes
