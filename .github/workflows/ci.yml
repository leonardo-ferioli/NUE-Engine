name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  desktop:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, preset: windows-x64 }
          - { os: windows-latest, preset: windows-x86 }
          - { os: ubuntu-latest,  preset: linux-x64 }
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check for a CMake project
        id: project
        shell: bash
        run: |
          if [ -f CMakeLists.txt ] && [ -f CMakePresets.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Linux dependencies
        if: steps.project.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libudev-dev
      - name: Configure
        if: steps.project.outputs.present == 'true'
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        if: steps.project.outputs.present == 'true'
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: |
          if ! ctest --preset ${{ matrix.preset }} --output-on-failure; then
            f="$(find build -name LastTestsFailed.log | head -1)"
            names="$(cut -d: -f2 "$f" 2>/dev/null | paste -sd' ')"
            echo "::error title=ctest failed::$names"
            for t in $(cut -d: -f2 "$f" 2>/dev/null); do
              out="$(ctest --preset ${{ matrix.preset }} -R "^${t}$" --output-on-failure 2>&1 | grep -E 'FAIL|Failed|error|assert' | head -5 | paste -sd'|')"
              echo "::error title=${t}::${out}"
            done
            exit 1
          fi

  android:
    name: android-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check for a CMake project
        id: project
        run: |
          if [ -f CMakeLists.txt ] && [ -f CMakePresets.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Configure and build (NDK, no tests on the runner)
        if: steps.project.outputs.present == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          cmake --preset android-arm64
          cmake --build --preset android-arm64

  ios:
    name: ios-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check for a CMake project
        id: project
        run: |
          if [ -f CMakeLists.txt ] && [ -f CMakePresets.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Configure and build (build only, unsigned)
        if: steps.project.outputs.present == 'true'
        run: |
          brew install ninja || true
          cmake --preset ios-arm64
          cmake --build --preset ios-arm64
