org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=false

# Where the SDL3 source tree is (Java classes for the activity + CMake build of libSDL3.so). Fetch it with
# scripts/fetch_sdl3.ps1 (Windows) or scripts/fetch_sdl3.sh. nue-core may point this at its own copy.
nue.sdl3.dir=.deps/SDL3

# ABIs to build. arm64-v8a is the supported target; add armeabi-v7a only for experiments (the recompiled game is
# not expected to fit the 32-bit ARM budget).
nue.abis=arm64-v8a
