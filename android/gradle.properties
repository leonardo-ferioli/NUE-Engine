org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=false

# SDL3 (pinned submodule third_party/SDL, git submodule update --init --depth 1 third_party/SDL): its Java classes are
# compiled into the AAR; libSDL3 itself is linked statically into libnue.so by the core CMake.
nue.sdl3.dir=../third_party/SDL

# ABIs to build. arm64-v8a is the supported target; add armeabi-v7a only for experiments (the recompiled game is
# not expected to fit the 32-bit ARM budget).
nue.abis=arm64-v8a
