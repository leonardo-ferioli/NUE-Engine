.t{fill:#1f2328}.m{fill:#656d76}.br{stroke:#8c959f;fill:none}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.layer{fill:#161b22;stroke:#30363d}.cell{fill:#0d1117;stroke:#30363d}
.yours{stroke:#6e7681}.ext{stroke:#30363d}.t{fill:#e6edf3}.m{fill:#8b949e}.br{stroke:#6e7681}}
</style>
