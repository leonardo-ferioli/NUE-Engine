# Extra Linux verification: sanitizers, valgrind, musl, an Arch container as the SteamOS stand-in, and packaging in clean containers.
#
# This file lives in the Linux platform folder because the Linux session does not own .github/. To activate it, copy it to
# .github/workflows/linux-extra.yml (the main session decides). Status: written, never run.
name: linux-extra

on:
  workflow_dispatch:
  push:
    branches: [linux, main]
    paths: ["src/platform/linux/**", ".github/workflows/linux-extra.yml"]
  pull_request:
    paths: ["src/platform/linux/**"]

jobs:
  # ASan + UBSan, then valgrind, on the Linux layer's own tests (the directory builds standalone: no SDL needed).
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind dbus
      - name: AddressSanitizer + UBSan
        run: |
          cmake -S src/platform/linux -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNUE_LINUX_SANITIZE=address,undefined
          cmake --build build-asan
          export ASAN_OPTIONS=detect_leaks=1:abort_on_error=0:strict_string_checks=1
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          # a real session bus makes the D-Bus code paths run instead of failing gracefully
          dbus-run-session -- build-asan/nue_linux_tests
          dbus-run-session -- build-asan/nue_linux_ops_tests
      - name: valgrind (memcheck)
        run: |
          cmake -S src/platform/linux -B build-vg -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-vg
          # fork + SIGSEGV self-test and io_uring probing are expected to be noisy under valgrind: leaks and invalid accesses are what matter
          valgrind --error-exitcode=9 --leak-check=full --errors-for-leak-kinds=definite --track-origins=yes build-vg/nue_linux_tests
          valgrind --error-exitcode=9 --leak-check=full --errors-for-leak-kinds=definite build-vg/nue_linux_ops_tests

  # musl: Alpine. Same sources, no glibc extensions (execinfo.h is absent: the crash handler then writes no backtrace).
  musl:
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - run: apk add --no-cache build-base cmake ninja linux-headers git dbus
      - uses: actions/checkout@v4
      - run: |
          cmake -S src/platform/linux -B build-musl -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-musl
          dbus-run-session -- build-musl/nue_linux_tests
          build-musl/nue_linux_ops_tests
          build-musl/linux_probe --headless

  # Arch Linux is the base of SteamOS: build, run the tests and the probe; then run the probe the way Steam launches a game in Gaming Mode.
  arch-steamos-standin:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm base-devel cmake ninja git dbus
      - uses: actions/checkout@v4
      - run: |
          cmake -S src/platform/linux -B build-arch -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arch
          dbus-run-session -- build-arch/nue_linux_tests
          build-arch/nue_linux_ops_tests
      - name: Probe as Steam would start it (environment only; this is NOT a Steam Deck)
        run: |
          export SteamDeck=1 SteamGamepadUI=1 SteamGameId=1234567 DISPLAY=:1
          build-arch/linux_probe --headless | tee probe.txt
          grep -q "gaming mode" probe.txt          # session mode from SteamGamepadUI
          grep -q "launched by steam *yes" probe.txt
          grep -q "not SteamOS-like" probe.txt       # a plain Arch image must NOT be reported as SteamOS

  # Packaging: SDK + runtime tarballs, AppImage, then the smoke test in clean containers.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libudev-dev
      - name: Redistributables
        run: src/platform/linux/packaging/build-redist.sh --static-cxx --out dist
      - name: AppImage
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage   # pin a version / checksum before relying on it
          chmod +x appimagetool
          export APPIMAGE_EXTRACT_AND_RUN=1
          src/platform/linux/packaging/build-appimage.sh --runtime-tar dist/nue-runtime-*-linux-x86_64.tar.gz --tool ./appimagetool --out dist
      - name: Clean containers (no desktop libraries, no sound server)
        run: |
          for image in debian:stable-slim ubuntu:22.04 archlinux:latest fedora:latest; do
            src/platform/linux/packaging/clean-container-test.sh dist/nue-runtime-*-linux-x86_64.tar.gz "$image"
            src/platform/linux/packaging/clean-container-test.sh dist/NUE-Sample-x86_64.AppImage "$image"
          done
      - uses: actions/upload-artifact@v4
        with: { name: linux-packages, path: dist/ }

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: org.nue.Sample.flatpak
          manifest-path: src/platform/linux/packaging/flatpak/org.nue.Sample.yml
          cache-key: flatpak-builder-${{ github.sha }}
